
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Montevía - Bosque encantado</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #10150e;
      font-family: Arial, sans-serif;
    }

    a-scene { position: fixed; inset: 0; }

    .panel {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 28px;
      text-align: center;
      color: #f7e5bd;
      background: linear-gradient(145deg, #18251a, #080b08);
    }

    .panel h1 {
      font-family: Georgia, serif;
      font-weight: normal;
      letter-spacing: 3px;
    }

    .panel p {
      line-height: 1.5;
      max-width: 330px;
    }

    button {
      padding: 15px 25px;
      border: 1px solid #e4bd72;
      border-radius: 30px;
      background: #49351d;
      color: #fff0cf;
      font-size: 15px;
      margin-top: 15px;
    }

    #error {
      color: #ffb7a8;
      overflow-wrap: anywhere;
      font-size: 13px;
    }

    #status {
      position: fixed;
      z-index: 10;
      top: 15px;
      left: 12px;
      right: 12px;
      color: white;
      text-align: center;
      font-size: 13px;
      text-shadow: 0 2px 5px black;
      pointer-events: none;
    }

    #cameraPreview {
      display: none;
    }

    .a-enter-vr, .a-enter-ar, .a-orientation-modal {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="start" class="panel">
    <h1>MONTEVÍA</h1>
    <p>El bosque encantado</p>
    <p>Permite el acceso a la cámara y apunta al cuadro para despertar la experiencia.</p>
    <button id="startButton">INICIAR EXPERIENCIA</button>
    <p id="error"></p>
  </div>

  <div id="status">Preparando experiencia...</div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind.txt; autoStart: false; uiLoading: no; uiError: no; uiScanning: no"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-ring
        position="0 0 0.02"
        radius-inner="0.43"
        radius-outer="0.47"
        color="#e5b75e"
        material="shader: flat; opacity: 0.8">
      </a-ring>

      <a-sphere
        position="0 0.15 0.12"
        radius="0.10"
        color="#f7d88d"
        material="emissive: #b97824; emissiveIntensity: 0.7">
        <a-animation
          attribute="scale"
          dur="1800"
          direction="alternate"
          repeat="indefinite"
          to="1.3 1.3 1.3">
        </a-animation>
      </a-sphere>

      <a-text
        value="MONTEVÍA"
        position="0 -0.38 0.08"
        align="center"
        color="#f7e5bd"
        width="1.5">
      </a-text>
    </a-entity>
  </a-scene>

  <script>
    const startButton = document.getElementById("startButton");
    const startPanel = document.getElementById("start");
    const errorBox = document.getElementById("error");
    const statusBox = document.getElementById("status");
    const scene = document.getElementById("scene");

    function showError(message) {
      errorBox.textContent = message;
      statusBox.textContent = "No se pudo iniciar la experiencia";
    }

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      startButton.textContent = "INICIANDO...";
      errorBox.textContent = "";
      statusBox.textContent = "Comprobando archivos...";

      try {
        if (!window.isSecureContext) {
          throw new Error("Abre la experiencia desde HTTPS.");
        }

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error("Este navegador no permite acceder a la cámara.");
        }

        const response = await fetch("./targets.mind.txt", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            "No se encuentra targets.mind.txt. Comprueba que esté publicado junto a index.html."
          );
        }

        if (!window.AFRAME || !window.MINDAR) {
          throw new Error("No se pudieron cargar las librerías de realidad aumentada. Comprueba tu conexión.");
        }

        statusBox.textContent = "Solicitando acceso a la cámara...";

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });

        stream.getTracks().forEach(track => track.stop());

        statusBox.textContent = "Iniciando reconocimiento del cuadro...";
        const arSystem = scene.systems["mindar-image-system"];

        if (!arSystem) {
          throw new Error("MindAR no se ha inicializado correctamente.");
        }

        await scene.renderer && scene.renderer.compile(
          scene.object3D,
          scene.camera
        );

        await arSystem.start();

        startPanel.style.display = "none";
        statusBox.textContent = "Apunta al cuadro de Montevía";

      } catch (error) {
        console.error(error);
        showError(error.message || "Error desconocido al iniciar.");
        startButton.disabled = false;
        startButton.textContent = "INTENTAR DE NUEVO";
      }
    });

    scene.addEventListener("targetFound", () => {
      statusBox.textContent = "¡El bosque encantado ha despertado!";
    });

    scene.addEventListener("targetLost", () => {
      statusBox.textContent = "Vuelve a enfocar el cuadro";
    });

    scene.addEventListener("arError", event => {
      console.error("Error de realidad aumentada:", event);
      showError("MindAR encontró un error. Revisa la consola del navegador.");
    });
  </script>
</body>
</html>
