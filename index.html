<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d09;font-family:Arial,sans-serif;isolation:isolate}/* Capas estables: cámara detrás del canvas WebGL transparente; controles siempre arriba. */
video.mindar-video, video[class*='mindar'], video{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;object-fit:cover!important;display:block!important;visibility:visible!important;opacity:1!important;z-index:0!important;background:#090d09!important;}
a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;z-index:1!important;background:transparent!important;pointer-events:none!important;}
a-scene canvas{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;z-index:2!important;background:transparent!important;}
.a-enter-vr,.a-enter-ar,.a-orientation-modal{display:none!important}
#title{position:fixed;z-index:20;top:calc(16px + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#f7dfaa;font:16px Georgia,serif;letter-spacing:2px;text-shadow:0 2px 12px #000;pointer-events:none}
#hint{position:fixed;z-index:20;left:16px;right:16px;bottom:calc(100px + env(safe-area-inset-bottom));text-align:center;color:#fff0cf;font-size:13px;text-shadow:0 2px 8px #000;pointer-events:none}
#controls{position:fixed;z-index:1000;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;padding:0 12px}
.action{min-width:0;flex:1;max-width:190px;padding:13px 10px;border:1px solid #d9b36c;border-radius:28px;background:rgba(24,20,14,.88);color:#ffedc8;font-size:12px;font-weight:700;letter-spacing:.4px;box-shadow:0 4px 18px #0008;backdrop-filter:blur(6px)}.action:disabled{opacity:.55}.action.recording{background:#8e241b;border-color:#ffb8a7;color:#fff}
#status{position:fixed;z-index:1001;top:calc(52px + env(safe-area-inset-top));left:12px;right:12px;margin:auto;max-width:460px;padding:9px 12px;border:1px solid #c49b5d;border-radius:12px;background:rgba(10,12,9,.88);color:#ffe9bd;text-align:center;font-size:12px;line-height:1.4;pointer-events:none}
#start{position:fixed;z-index:50;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;background:radial-gradient(ellipse at center,#263321,#080b08 75%);color:#f7e5bd;text-align:center}#start h1{font:normal 27px Georgia,serif;letter-spacing:4px;margin:0 0 8px}#start p{max-width:330px;line-height:1.5;font-size:14px}#start button{margin-top:15px;border:1px solid #e4bd72;border-radius:28px;padding:15px 28px;background:#49351d;color:#fff0cf;font-weight:bold}#startError{color:#ffc0ae;overflow-wrap:anywhere;font-size:12px;max-width:340px}
#glow{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,170,60,.20) 100%);transition:opacity .6s}body.found #glow{opacity:1}
</style>
<script>
(function(){
'use strict';
const THREE=AFRAME.THREE;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function texture(draw,w=256,h=256){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;}
const palettes=[
 {type:'monarch',edge:'#21130f',mid:'#ed7925',light:'#ffc36b',spot:'#fff4dc'},
 {type:'monarch',edge:'#24150f',mid:'#d95d1f',light:'#ffb64f',spot:'#fff1d2'},
 {type:'morpho',edge:'#102c52',mid:'#168ed0',light:'#b8f4ff',spot:'#f1fbff'},
 {type:'morpho',edge:'#132b56',mid:'#276fc0',light:'#c4f6ff',spot:'#f5ffff'}
];
function wingMap(p){return texture((c,w,h)=>{
 c.clearRect(0,0,w,h);
 if(p.type==='monarch'){
  const g=c.createLinearGradient(40,20,220,220);g.addColorStop(0,'#ffca70');g.addColorStop(.45,p.mid);g.addColorStop(1,'#b94319');c.fillStyle=g;c.fillRect(0,0,w,h);
  // Escamas cálidas finísimas y variación natural del naranja.
  for(let i=0;i<4200;i++){const x=rand(0,w),y=rand(0,h);c.fillStyle=`rgba(255,231,178,${rand(.025,.11)})`;c.beginPath();c.ellipse(x,y,rand(.35,1.15),rand(.6,1.8),rand(-.7,.7),0,Math.PI*2);c.fill();}
  // Venas negras ramificadas, patrón característico de monarca.
  c.strokeStyle='rgba(31,17,13,.88)';c.lineWidth=5;c.beginPath();c.moveTo(12,248);c.quadraticCurveTo(100,150,246,8);c.stroke();
  c.lineWidth=2.2;for(let i=0;i<9;i++){const y=24+i*25;c.beginPath();c.moveTo(20,235);c.quadraticCurveTo(90,y+45,245,y);c.stroke();}
  for(let i=0;i<7;i++){c.beginPath();c.moveTo(35+i*5,225-i*4);c.quadraticCurveTo(130+i*7,170-i*17,230,45+i*19);c.stroke();}
  // Borde oscuro y puntos crema marginales.
  c.strokeStyle='#21130f';c.lineWidth=15;c.beginPath();c.moveTo(8,246);c.quadraticCurveTo(110,120,248,7);c.stroke();
  c.fillStyle='#fff2d9';for(let i=0;i<15;i++){const x=220+(i%3)*9,y=18+i*15;c.beginPath();c.arc(x,y,3.1,0,Math.PI*2);c.fill();}
 }else{
  const g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,'#071d43');g.addColorStop(.25,'#087bc4');g.addColorStop(.52,'#55d9f4');g.addColorStop(.78,'#1765b5');g.addColorStop(1,'#071b3c');c.fillStyle=g;c.fillRect(0,0,w,h);
  // Iridiscencia azul/cian y escamas microscópicas.
  for(let i=0;i<5000;i++){const x=rand(0,w),y=rand(0,h);c.fillStyle=`rgba(191,249,255,${rand(.025,.12)})`;c.beginPath();c.ellipse(x,y,rand(.4,1.2),rand(.8,2.2),rand(-.6,.6),0,Math.PI*2);c.fill();}
  c.strokeStyle='rgba(5,20,55,.95)';c.lineWidth=16;c.beginPath();c.moveTo(10,245);c.quadraticCurveTo(95,105,246,8);c.stroke();
  c.strokeStyle='rgba(183,248,255,.55)';c.lineWidth=2;for(let i=0;i<18;i++){c.beginPath();c.moveTo(20,235);c.quadraticCurveTo(100,100+i*4,238,15+i*12);c.stroke();}
  const glow=c.createRadialGradient(110,95,5,120,120,145);glow.addColorStop(0,'rgba(225,255,255,.45)');glow.addColorStop(1,'rgba(40,170,255,0)');c.fillStyle=glow;c.fillRect(0,0,w,h);
 }
 },256,256);}
const leafMap=texture((c,w,h)=>{
 const g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,'#f6c45b');g.addColorStop(.28,'#c84e20');g.addColorStop(.62,'#9d321b');g.addColorStop(1,'#e99a32');c.fillStyle=g;c.fillRect(0,0,w,h);
 for(let i=0;i<1800;i++){c.fillStyle=`rgba(255,222,145,${rand(.015,.07)})`;c.beginPath();c.ellipse(rand(0,w),rand(0,h),rand(.4,1.2),rand(.5,1.7),0,0,Math.PI*2);c.fill();}
 c.strokeStyle='rgba(83,37,19,.8)';c.lineWidth=3;c.beginPath();c.moveTo(w/2,h);c.quadraticCurveTo(w/2-8,h/2,w/2,0);c.stroke();
 c.lineWidth=1.25;for(let i=1;i<9;i++){const y=h-i*h/9;c.beginPath();c.moveTo(w/2,y);c.quadraticCurveTo(w*.27,y-8,5,y-18);c.moveTo(w/2,y);c.quadraticCurveTo(w*.72,y-8,w-5,y-18);c.stroke();}
},128,192);
function createButterfly(p){
 const root=new THREE.Group(),body=new THREE.Group(),wings=[];
 const makeWing=(upper)=>{const sh=new THREE.Shape();if(upper){sh.moveTo(0,0);sh.bezierCurveTo(.08,.20,.25,.39,.47,.34);sh.bezierCurveTo(.61,.30,.52,.10,.30,.015);sh.bezierCurveTo(.18,-.015,.07,-.005,0,0);}else{sh.moveTo(0,0);sh.bezierCurveTo(.16,-.035,.38,-.12,.34,-.29);sh.bezierCurveTo(.30,-.43,.12,-.38,.055,-.22);sh.bezierCurveTo(.015,-.12,0,-.05,0,0);}const geo=new THREE.ExtrudeGeometry(sh,{depth:.006,bevelEnabled:true,bevelSegments:2,steps:1,bevelSize:.004,bevelThickness:.003});geo.computeVertexNormals();return geo;};
 const mat=new THREE.MeshPhysicalMaterial({map:wingMap(p),side:THREE.DoubleSide,roughness:p.type==='morpho'?.34:.72,metalness:p.type==='morpho'?.24:.02,clearcoat:p.type==='morpho'?.75:.18,clearcoatRoughness:.28});
 for(const side of [-1,1]){for(const upper of [true,false]){const pivot=new THREE.Group();pivot.position.set(0,upper?.012:-.015,upper?.012:.018);const mesh=new THREE.Mesh(makeWing(upper),mat);mesh.scale.x=side;mesh.position.z=.008;pivot.add(mesh);
  // Nervaduras finas sobre las alas, con brillo discreto.
  const end=upper?new THREE.Vector3(.43,.30,.02):new THREE.Vector3(.31,-.29,.02);for(let k=0;k<5;k++){const curve=new THREE.QuadraticBezierCurve3(new THREE.Vector3(.015,0,.022),new THREE.Vector3(.12+k*.035,(upper?1:-1)*(.07+k*.025),.022),end.clone().multiplyScalar(.65+k*.07));const vein=new THREE.Mesh(new THREE.TubeGeometry(curve,10,.0015,4,false),new THREE.MeshBasicMaterial({color:p.type==='monarch'?'#542719':'#b9f6ff',transparent:true,opacity:.48}));vein.scale.x=side;pivot.add(vein);}
  body.add(pivot);wings.push({pivot,side,upper});}}
 const dark=new THREE.MeshStandardMaterial({color:p.type==='monarch'?'#21150f':'#172c48',roughness:.9});const thorax=new THREE.Mesh(new THREE.SphereGeometry(.021,12,10),dark);thorax.scale.set(.8,1.7,.9);body.add(thorax);
 const abdomen=new THREE.Mesh(new THREE.CapsuleGeometry(.009,.105,4,8),new THREE.MeshStandardMaterial({color:'#33251b',roughness:1}));abdomen.rotation.x=Math.PI/2;abdomen.position.y=-.055;body.add(abdomen);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.019,12,10),dark);head.position.y=.045;body.add(head);
 for(const side of [-1,1]){const curve=new THREE.QuadraticBezierCurve3(new THREE.Vector3(side*.006,.06,0),new THREE.Vector3(side*.027,.12,.008),new THREE.Vector3(side*.055,.145,.01));body.add(new THREE.Mesh(new THREE.TubeGeometry(curve,12,.002,5,false),new THREE.MeshStandardMaterial({color:'#302016',roughness:.8})));}
 root.add(body);root.userData.wings=wings;return root;
}
function fishTexture(colorA,colorB){return texture((c,w,h)=>{
 const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#d8fff1');g.addColorStop(.22,colorA);g.addColorStop(.7,colorB);g.addColorStop(1,'#102c38');c.fillStyle=g;c.fillRect(0,0,w,h);
 for(let y=18;y<h;y+=17)for(let x=18;x<w;x+=17){c.beginPath();c.ellipse(x+(y%2)*7,y,5,3,.1,0,Math.PI*2);c.fillStyle='rgba(220,255,244,.15)';c.fill();c.strokeStyle='rgba(5,42,55,.18)';c.lineWidth=.8;c.stroke();}
 c.strokeStyle='rgba(215,255,242,.35)';c.lineWidth=2;for(let i=0;i<7;i++){c.beginPath();c.moveTo(12+i*5,12);c.quadraticCurveTo(32+i*3,128,18+i*7,244);c.stroke();}
 },256,256);}
function makeFin(color){const sh=new THREE.Shape();sh.moveTo(0,0);sh.quadraticCurveTo(.12,.10,.27,.04);sh.quadraticCurveTo(.20,-.10,0,0);const geo=new THREE.ShapeGeometry(sh,12);const mat=new THREE.MeshPhysicalMaterial({color,roughness:.28,metalness:.12,side:THREE.DoubleSide,transparent:true,opacity:.94,clearcoat:.8,clearcoatRoughness:.2});return new THREE.Mesh(geo,mat);}
function createFish(index){
 const root=new THREE.Group(),swim=new THREE.Group();root.add(swim);
 const colors=[['#39c7c0','#176b79'],['#6ad7ce','#285c83'],['#d8b76c','#8a5937'],['#9bd9f0','#326c91'],['#8bcf9a','#286c62']];const pair=colors[index%colors.length];
 const bodyGeo=new THREE.SphereGeometry(1,32,22);const bodyMat=new THREE.MeshPhysicalMaterial({map:fishTexture(pair[0],pair[1]),color:'#ffffff',roughness:.26,metalness:.12,clearcoat:1,clearcoatRoughness:.18});const body=new THREE.Mesh(bodyGeo,bodyMat);body.scale.set(.27,.14,.115);swim.add(body);
 const tailPivot=new THREE.Group();tailPivot.position.x=-.235;swim.add(tailPivot);const tail=makeFin(pair[0]);tail.position.x=-.13;tail.scale.set(.95,1.2,1);tailPivot.add(tail);
 const dorsal=makeFin('#8fe2d7');dorsal.position.set(-.03,.095,0);dorsal.rotation.z=Math.PI/2;dorsal.scale.set(.62,.55,1);swim.add(dorsal);
 for(const side of [-1,1]){const fin=makeFin('#7dd9ce');fin.position.set(-.02,-.045,side*.085);fin.rotation.x=side*.55;fin.rotation.z=-.5;fin.scale.set(.52,.5,1);swim.add(fin);}
 const eyeMat=new THREE.MeshStandardMaterial({color:'#071923',roughness:.12,metalness:.1});const irisMat=new THREE.MeshBasicMaterial({color:'#f4fff1'});for(const side of [-1,1]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.018,12,10),eyeMat);eye.position.set(.17,.035,side*.095);swim.add(eye);const glint=new THREE.Mesh(new THREE.SphereGeometry(.005,8,8),irisMat);glint.position.set(.176,.042,side*.108);swim.add(glint);}
 const gill=new THREE.Mesh(new THREE.TorusGeometry(.055,.003,5,20,Math.PI),new THREE.MeshBasicMaterial({color:'#b9f4df',transparent:true,opacity:.55}));gill.position.set(.105,0,.105);gill.rotation.y=Math.PI/2;swim.add(gill);
 // pequeñas aletas pectorales translúcidas y articuladas
 const pectorals=[];for(const side of [-1,1]){const pivot=new THREE.Group();pivot.position.set(.055,-.015,side*.10);const fin=makeFin('#b3f1dd');fin.scale.set(.45,.42,1);pivot.add(fin);swim.add(pivot);pectorals.push({pivot,side});}
 root.userData={swim,tailPivot,pectorals};return root;
}
function makeRay(){const geo=new THREE.ConeGeometry(.055,1,12,1,true);geo.translate(0,-.5,0);const mat=new THREE.MeshBasicMaterial({color:'#72e6d1',transparent:true,opacity:.075,depthWrite:false,side:THREE.DoubleSide});return new THREE.Mesh(geo,mat);}
AFRAME.registerComponent('magic-forest',{schema:{height:{default:1.5}},init:function(){
 this.root=new THREE.Group();this.el.object3D.add(this.root);this.clock=0;this.foundAt=0;this.active=false;this.butterflies=[];const H=this.data.height;
 // Mundo acuático híbrido: peces articulados, haces de luz y burbujas en varias profundidades.
 this.fish=[];for(let i=0;i<11;i++){const obj=createFish(i);const scale=rand(.72,1.35);obj.scale.setScalar(scale);this.root.add(obj);this.fish.push({obj,x:rand(-.62,.62),y:rand(-.55,.55),z:rand(.12,.95),phase:rand(0,Math.PI*2),speed:rand(.16,.34),radius:rand(.18,.42),scale,turn:rand(.7,1.5)});}
 this.rays=[];for(let i=0;i<7;i++){const ray=makeRay();ray.position.set(rand(-.62,.62),.72,rand(.15,.75));ray.rotation.z=rand(-.25,.25);ray.scale.set(rand(.65,1.4),rand(1.2,2.1),1);this.root.add(ray);this.rays.push({ray,phase:rand(0,6.28),speed:rand(.12,.25)});}
 this.bubbles=[];const bubbleMat=new THREE.MeshPhysicalMaterial({color:'#b7fff1',roughness:.08,metalness:.1,transparent:true,opacity:.38,transmission:.45,thickness:.15});for(let i=0;i<32;i++){const r=rand(.008,.022);const b=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),bubbleMat);this.root.add(b);this.bubbles.push({b,x:rand(-.72,.72),y:rand(-.8,.45),z:rand(.18,1.05),phase:rand(0,6.28),speed:rand(.12,.28)});}

 // Las mariposas aparecen desde el plano del cuadro y avanzan hacia la cámara (Z positivo).
 for(let i=0;i<12;i++){const obj=createButterfly(palettes[i%palettes.length]);const size=rand(.14,.21);obj.scale.setScalar(size);this.root.add(obj);this.butterflies.push({obj,delay:i*.42,x:rand(-.34,.34),y:rand(-H*.32,H*.32),z:rand(.015,.07),phase:rand(0,6.28),speed:rand(.72,1.12),size,drift:rand(.10,.22),flap:rand(9,13)});}
 const leafShape=new THREE.Shape();leafShape.moveTo(0,-.12);leafShape.bezierCurveTo(.11,-.02,.12,.12,0,.22);leafShape.bezierCurveTo(-.12,.12,-.11,-.02,0,-.12);const leafGeo=new THREE.ShapeGeometry(leafShape,8);this.leaves=[];
 for(let i=0;i<18;i++){const m=new THREE.Mesh(leafGeo,new THREE.MeshStandardMaterial({map:leafMap,side:THREE.DoubleSide,roughness:1}));m.scale.setScalar(rand(.20,.34));this.root.add(m);this.leaves.push({m,x:rand(-.65,.65),z:rand(.12,.55),phase:rand(0,6.28),speed:rand(.07,.13),spin:rand(.6,1.3)});}
 const N=55,geo=new THREE.BufferGeometry(),positions=new Float32Array(N*3);this.particles=[];for(let i=0;i<N;i++){this.particles.push({x:rand(-.7,.7),y:rand(-H/2,H/2),z:rand(.1,.7),phase:rand(0,6.28),speed:rand(.8,2)});}geo.setAttribute('position',new THREE.BufferAttribute(positions,3));this.points=new THREE.Points(geo,new THREE.PointsMaterial({color:'#ffda8a',size:.018,transparent:true,opacity:.8,depthWrite:false}));this.root.add(this.points);
 this.el.addEventListener('targetFound',()=>{this.active=true;this.foundAt=this.clock;});this.el.addEventListener('targetLost',()=>{this.active=false;});
 },tick:function(time,dt){if(!this.active)return;const delta=Math.min((dt||16)/1000,.04);this.clock+=delta;const t=this.clock,H=this.data.height;
 const gust=Math.sin(t*.48)*.55+Math.sin(t*1.17+1.4)*.28;this.butterflies.forEach(b=>{const age=t-this.foundAt-b.delay;if(age<0){b.obj.visible=false;return;}b.obj.visible=true;const k=clamp(age/1.35,0,1),ease=1-Math.pow(1-k,3),u=t*b.speed+b.phase;const wind=gust*(.035+Math.sin(u*.35)*.018);const x=b.x+Math.sin(u*.8)*b.drift+Math.sin(u*1.5)*.035+wind;const y=b.y+Math.sin(u*.7+b.phase)*.13+Math.cos(u*1.3)*.025+gust*.018;const z=b.z+Math.min(age*.15,.8)+.045*Math.sin(u);b.obj.position.set(x*ease,y*ease,z);b.obj.rotation.set(.10*Math.sin(u)+gust*.08,Math.sin(u*.6)*.30,Math.sin(u*.75)*.25+gust*.13);b.obj.scale.setScalar(b.size*ease*(1+.025*Math.sin(u*2)));const wingBeat=Math.sin(t*b.flap+b.phase);const flap=.15+Math.max(0,wingBeat)*.95-Math.max(0,-wingBeat)*.16;b.obj.userData.wings.forEach(w=>{const factor=w.upper?1:.78;w.pivot.rotation.y=w.side*flap*factor;w.pivot.rotation.z=w.side*(.055+.045*Math.sin(u+(w.upper?0:.7)));});});
 this.fish.forEach(f=>{const u=t*f.speed+f.phase;const x=f.x+Math.sin(u)*f.radius;const y=f.y+Math.sin(u*.73+f.phase)*.16;const z=f.z+.12*Math.cos(u*.6);f.obj.position.set(x,y,z);f.obj.rotation.y=Math.sin(u*.8)*.18;f.obj.rotation.z=Math.sin(u*.65)*.12;f.obj.rotation.x=Math.cos(u*.7)*.08;const ud=f.obj.userData;ud.swim.position.y=Math.sin(u*2.2)*.018;ud.tailPivot.rotation.y=Math.sin(u*7.5)*.58;ud.pectorals.forEach(p=>{p.pivot.rotation.y=p.side*(.2+Math.sin(u*6+p.side)*.24);p.pivot.rotation.x=Math.sin(u*4)*.12;});const dir=Math.cos(u);f.obj.scale.x=f.scale*(dir<-.15?-1:1);});
 this.rays.forEach(r=>{const u=t*r.speed+r.phase;r.ray.material.opacity=.035+.035*(.5+.5*Math.sin(u));r.ray.position.x+=Math.sin(u)*.0007;});
 this.bubbles.forEach(p=>{const u=t*p.speed+p.phase;const yy=((p.y+t*p.speed*.22+1.0)%1.8)-.9;p.b.position.set(p.x+.025*Math.sin(u),yy,p.z);});
 this.leaves.forEach(l=>{const u=t*l.speed+l.phase;const breeze=gust*.10;l.m.position.set(l.x+Math.sin(u*2)*.07+breeze,((l.phase+t*l.speed*1.4)%(H+.5))-H/2,l.z+.04*Math.sin(u));l.m.rotation.set(.4*Math.sin(u)+gust*.12,u*l.spin,Math.sin(u*.8)*.65+gust*.20);});const a=this.points.geometry.attributes.position;this.particles.forEach((p,i)=>{const u=t*p.speed+p.phase;a.setXYZ(i,p.x+.045*Math.sin(u),p.y+.035*Math.cos(u*.7),p.z);});a.needsUpdate=true;
 }});
})();
</script>

<div id="controls"><button class="action" id="photo" disabled>◉ TOMAR FOTO</button><button class="action" id="video" disabled>● GRABAR VIDEO</button></div>
<div id="start"><h1>MONTEVÍA</h1><p>El bosque encantado</p><p>Activa la cámara y apunta al cuadro: el bosque despierta bajo el agua.</p><button id="startButton">INICIAR EXPERIENCIA</button><div id="startError"></div></div>
<a-scene id="scene" embedded mindar-image="imageTargetSrc: ./targets.mind.txt; autoStart: false; uiLoading: no; uiError: no; uiScanning: no; maxTrack: 1" renderer="alpha: true; antialias: true; colorManagement: true; precision: mediump; preserveDrawingBuffer: true; logarithmicDepthBuffer: false" color-space="sRGB" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
<a-entity light="type: ambient; intensity: 1.1; color: #fff0d5"></a-entity><a-entity light="type: directional; intensity: 1.25; color: #ffe0a0" position="-1 2 3"></a-entity>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity mindar-image-target="targetIndex: 0" magic-forest="height: 1.5"></a-entity>
</a-scene>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),scene=$('scene'),target=document.querySelector('[mindar-image-target]'),start=$('start'),startButton=$('startButton'),startError=$('startError'),status=$('status'),photo=$('photo'),videoButton=$('video');
let arSystem=null,found=false,recorder=null,recordStream=null,recordCanvas=null,recordCtx=null,recordRAF=0,chunks=[];
function say(t){status.textContent=t;}
function error(t){startError.textContent=t;say(t);startButton.disabled=false;startButton.textContent='INTENTAR DE NUEVO';}
function targetChanged(value){found=value;document.body.classList.toggle('found',value);$('hint').textContent=value?'¡El bosque ha despertado!':'Busca el cuadro para activar los peces y las mariposas';say(value?'¡Cuadro reconocido! Ya puedes tomar fotos o grabar.':'Cámara lista. Buscando el cuadro…');}
function cameraVideo(){return document.querySelector('video');}
function fitDraw(ctx,source,w,h){const sw=source.videoWidth||source.width,sh=source.videoHeight||source.height;if(!sw||!sh)return;const scale=Math.max(w/sw,h/sh),cw=w/scale,ch=h/scale;ctx.drawImage(source,(sw-cw)/2,(sh-ch)/2,cw,ch,0,0,w,h);}
function drawComposite(){const v=cameraVideo(),gl=scene.renderer&&scene.renderer.domElement;if(!v||v.readyState<2||!gl||!recordCtx)return;const w=recordCanvas.width,h=recordCanvas.height;recordCtx.clearRect(0,0,w,h);fitDraw(recordCtx,v,w,h);recordCtx.drawImage(gl,0,0,w,h);const g=recordCtx.createRadialGradient(w/2,h/2,h*.20,w/2,h/2,h*.78);g.addColorStop(0,'rgba(255,190,95,0)');g.addColorStop(1,'rgba(255,170,65,.17)');recordCtx.fillStyle=g;recordCtx.fillRect(0,0,w,h);}
function setupComposite(){const v=cameraVideo(),gl=scene.renderer&&scene.renderer.domElement;if(!v||!gl||!v.videoWidth)throw new Error('La cámara todavía no entrega imagen. Espera unos segundos y vuelve a intentar.');const ratio=innerWidth/innerHeight;const max=1280;let w,h;if(ratio>=1){w=max;h=Math.round(max/ratio);}else{h=max;w=Math.round(max*ratio);}recordCanvas=document.createElement('canvas');recordCanvas.width=w;recordCanvas.height=h;recordCtx=recordCanvas.getContext('2d',{alpha:false});drawComposite();}
function capturePhoto(){try{setupComposite();drawComposite();recordCanvas.toBlob(blob=>{if(!blob){say('No se pudo generar la fotografía.');return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='montevia-bosque-encantado.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);say('Fotografía guardada.');},'image/jpeg',.92);}catch(e){say(e.message);}}
function stopRecording(){if(recorder&&recorder.state!=='inactive')recorder.stop();videoButton.textContent='● GRABAR VIDEO';videoButton.classList.remove('recording');}
function startRecording(){try{if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)throw new Error('Este navegador no admite grabación de video desde la experiencia. Prueba con Chrome actualizado.');setupComposite();const stream=recordCanvas.captureStream(24);recordStream=stream;const mimeTypes=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];const mime=mimeTypes.find(m=>MediaRecorder.isTypeSupported(m));if(!mime)throw new Error('El navegador no ofrece un formato de grabación compatible.');chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:3500000});recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};recorder.onerror=()=>say('El navegador informó un error durante la grabación.');recorder.onstop=()=>{cancelAnimationFrame(recordRAF);const blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='montevia-bosque-encantado.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);if(recordStream)recordStream.getTracks().forEach(t=>t.stop());recordStream=null;recorder=null;say('Video guardado en formato WebM.');};recorder.start(500);videoButton.textContent='■ DETENER VIDEO';videoButton.classList.add('recording');say('Grabando… pulsa DETENER VIDEO para guardar.');const draw=()=>{if(!recorder||recorder.state!=='recording')return;drawComposite();recordRAF=requestAnimationFrame(draw);};draw();}catch(e){say(e.message);}}
photo.addEventListener('click',capturePhoto);videoButton.addEventListener('click',()=>{if(recorder&&recorder.state==='recording')stopRecording();else startRecording();});
scene.addEventListener('loaded',()=>{say('Escena 3D lista. Pulsa iniciar para activar la cámara.');});
scene.addEventListener('arReady',()=>say('Cámara activa. Apunta al cuadro de Montevía.'));
scene.addEventListener('arError',e=>{console.error('MindAR:',e);say('MindAR no pudo iniciar. Revisa targets.mind.txt y los permisos de cámara.');});
target.addEventListener('targetFound',()=>targetChanged(true));target.addEventListener('targetLost',()=>targetChanged(false));
startButton.addEventListener('click',async()=>{startButton.disabled=true;startButton.textContent='INICIANDO…';startError.textContent='';say('Comprobando archivo de reconocimiento…');try{if(!window.isSecureContext)throw new Error('La experiencia necesita abrirse mediante HTTPS.');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Este navegador no permite acceder a la cámara. Abre el enlace en Chrome.');const response=await fetch('./targets.mind.txt',{cache:'no-store'});if(!response.ok)throw new Error('No se encontró targets.mind.txt junto a index.html (respuesta '+response.status+').');const data=await response.arrayBuffer();if(data.byteLength<100)throw new Error('targets.mind.txt parece vacío o incompleto. Sube el archivo .mind correcto.');if(!window.AFRAME)throw new Error('A-Frame no se pudo cargar. Comprueba la conexión a internet.');if(!scene.hasLoaded)await new Promise(resolve=>scene.addEventListener('loaded',resolve,{once:true}));arSystem=scene.systems['mindar-image-system'];if(!arSystem)throw new Error('No se encontró el sistema MindAR. Comprueba que la librería MindAR haya cargado.');say('Activando cámara y reconocimiento…');await arSystem.start();/* Refuerzo de capas: el video real de MindAR debe quedar delante del fondo y detrás del canvas transparente de A-Frame. */const cameraEl=document.querySelector('video');if(cameraEl){cameraEl.style.setProperty('position','fixed','important');cameraEl.style.setProperty('inset','0','important');cameraEl.style.setProperty('width','100vw','important');cameraEl.style.setProperty('height','100dvh','important');cameraEl.style.setProperty('object-fit','cover','important');cameraEl.style.setProperty('display','block','important');cameraEl.style.setProperty('visibility','visible','important');cameraEl.style.setProperty('opacity','1','important');cameraEl.style.setProperty('z-index','0','important');cameraEl.setAttribute('playsinline','');cameraEl.setAttribute('autoplay','');cameraEl.muted=true;try{await cameraEl.play();}catch(playError){console.warn('No se pudo reanudar el video:',playError);}}photo.disabled=false;videoButton.disabled=!window.MediaRecorder;start.style.display='none';say('Cámara activa. Apunta al cuadro.');}catch(e){console.error(e);error(e.message||'No se pudo iniciar la experiencia.');}});
window.addEventListener('beforeunload',()=>{if(recorder&&recorder.state==='recording')recorder.stop();if(recordStream)recordStream.getTracks().forEach(t=>t.stop());});
})();
</script>
</body>
</html>
