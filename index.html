<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Montevía | Bosque Encantado</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Georgia,serif}
a-scene{position:fixed!important;inset:0;width:100%;height:100%;z-index:1}
.a-enter-vr,.a-enter-ar,.a-orientation-modal{display:none!important}

#title,#hint{
position:fixed;left:0;width:100%;text-align:center;
z-index:5;pointer-events:none;text-shadow:0 2px 12px #000;
transition:opacity .7s
}
#title{top:calc(22px + env(safe-area-inset-top));color:#f5d99a;font-size:18px;letter-spacing:2px}
#hint{bottom:calc(105px + env(safe-area-inset-bottom));color:#fff0ce;font-size:13px}
body.found #title,body.found #hint{opacity:0}

#glow{
position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;
background:radial-gradient(ellipse at center,transparent 45%,rgba(255,170,60,.2));
transition:opacity 1s
}
body.found #glow{opacity:1}

#controls{
position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));
left:0;width:100%;z-index:10;display:none;
justify-content:center;gap:15px;padding:0 15px;
}
body.found #controls{display:flex}

.action{
border:1px solid rgba(255,220,160,.65);
background:rgba(25,20,15,.83);color:#ffe5ae;
border-radius:30px;padding:13px 20px;
font-size:13px;letter-spacing:1px;font-weight:bold;
backdrop-filter:blur(8px);min-width:135px;
}
.action:active{transform:scale(.96)}
#record.recording{background:#9b241b;color:white;border-color:#ffb0a0}
#status{
position:fixed;top:calc(65px + env(safe-area-inset-top));
left:0;width:100%;text-align:center;z-index:12;
color:#ffe4a9;font-size:12px;pointer-events:none;
}
</style>
</head>

<body>

<div id="title">MONTEVÍA · EL BOSQUE ENCANTADO</div>
<div id="hint">Apunta la cámara hacia el cuadro</div>
<div id="glow"></div>
<div id="status"></div>

<div id="controls">
<button class="action" id="photo">◉ TOMAR FOTO</button>
<button class="action" id="record">● GRABAR VIDEO</button>
</div>

<a-scene
mindar-image="
imageTargetSrc: ./targets.mind.txt;
autoStart: true;
uiLoading: no;
uiError: no;
uiScanning: no;
missTolerance: 15;
warmupTolerance: 4;
filterMinCF: 0.0001;
filterBeta: 0.01"
renderer="
antialias: false;
alpha: true;
precision: mediump;
powerPreference: low-power;
colorManagement: true;
sortObjects: true"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false"
embedded>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity mindar-image-target="targetIndex:0" magic-forest="aspect:1.5"></a-entity>

</a-scene>

<script>
(function(){

const THREE=AFRAME.THREE;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=THREE.MathUtils.clamp;

/* TEXTURAS PROCEDURALES */

function texture(draw){
 const c=document.createElement('canvas');
 c.width=128;c.height=128;
 const x=c.getContext('2d');
 draw(x);
 const t=new THREE.CanvasTexture(c);
 t.colorSpace=THREE.SRGBColorSpace;
 return t;
}

const wingTexture=texture(x=>{
 const g=x.createLinearGradient(0,0,128,128);
 g.addColorStop(0,'#ffe7a0');
 g.addColorStop(.35,'#e89a37');
 g.addColorStop(.7,'#b84c1e');
 g.addColorStop(1,'#f4c66d');
 x.fillStyle=g;x.fillRect(0,0,128,128);

 x.strokeStyle='rgba(55,25,8,.65)';
 x.lineWidth=1.5;

 for(let i=0;i<12;i++){
  x.beginPath();
  x.moveTo(0,64);
  x.quadraticCurveTo(55,i*11,128,i*10);
  x.stroke();
 }

 x.fillStyle='rgba(255,245,205,.8)';
 for(let i=0;i<7;i++){
  x.beginPath();
  x.arc(95,15+i*16,2,0,Math.PI*2);
  x.fill();
 }
});

const glowTexture=texture(x=>{
 const g=x.createRadialGradient(64,64,0,64,64,64);
 g.addColorStop(0,'rgba(255,245,190,.9)');
 g.addColorStop(.35,'rgba(255,190,90,.35)');
 g.addColorStop(1,'rgba(255,180,70,0)');
 x.fillStyle=g;x.fillRect(0,0,128,128);
});

/* GEOMETRÍA DE ALAS */

function createWing(){
 const s=new THREE.Shape();
 s.moveTo(0,0);
 s.bezierCurveTo(.04,.20,.18,.36,.38,.30);
 s.bezierCurveTo(.49,.25,.43,.07,.28,0);
 s.bezierCurveTo(.39,-.08,.34,-.25,.20,-.29);
 s.bezierCurveTo(.08,-.31,.02,-.16,0,0);
 return new THREE.ShapeGeometry(s,12);
}

const wingGeo=createWing();

const palettes=[
 {color:'#fff0c2',scale:1},
 {color:'#ffbd65',scale:1},
 {color:'#f5d88d',scale:1},
 {color:'#e7a7d0',scale:1}
];

/* COMPONENTE DE REALIDAD AUMENTADA */

AFRAME.registerComponent('magic-forest',{
 schema:{aspect:{default:1.5}},

 init:function(){

  const A=this.data.aspect;
  const root=this.root=new THREE.Group();
  this.el.object3D.add(root);

  this.time=0;
  this.active=false;
  this.elapsed=0;
  this.fade=0;

  /* MATERIALES */

  const wingMat=new THREE.MeshBasicMaterial({
   map:wingTexture,
   side:THREE.DoubleSide,
   transparent:true,
   depthWrite:false
  });

  const bodyMat=new THREE.MeshStandardMaterial({
   color:'#3b2412',
   roughness:.75
  });

  /* MARIPOSAS 3D */

  this.butterflies=[];

  for(let i=0;i<7;i++){

   const group=new THREE.Group();
   const body=new THREE.Mesh(
    new THREE.CapsuleGeometry(.018,.16,3,6),
    bodyMat
   );

   body.rotation.x=Math.PI/2;
   group.add(body);

   const leftPivot=new THREE.Group();
   const rightPivot=new THREE.Group();

   const leftWing=new THREE.Mesh(wingGeo,wingMat);
   const rightWing=new THREE.Mesh(wingGeo,wingMat);

   leftWing.position.x=.015;
   rightWing.position.x=-.015;
   rightWing.rotation.y=Math.PI;

   leftPivot.add(leftWing);
   rightPivot.add(rightWing);

   group.add(leftPivot,rightPivot);

   /* Antenas */

   for(let j=-1;j<=1;j+=2){
    const antenna=new THREE.Mesh(
     new THREE.CylinderGeometry(.002,.003,.12,4),
     bodyMat
    );
    antenna.position.set(j*.018,.09,.04);
    antenna.rotation.z=j*.25;
    group.add(antenna);
   }

   const light=new THREE.Sprite(
    new THREE.SpriteMaterial({
     map:glowTexture,
     color:'#ffc66c',
     transparent:true,
     blending:THREE.AdditiveBlending,
     depthWrite:false
    })
   );

   light.scale.set(.45,.45,1);
   group.add(light);

   group.scale.setScalar(rnd(.55,.9));
   root.add(group);

   this.butterflies.push({
    group,
    leftPivot,
    rightPivot,
    phase:rnd(0,6.28),
    speed:rnd(.65,1.15),
    size:rnd(.8,1.2),
    start:rnd(0,2.5),
    x:rnd(-.35,.35),
    y:rnd(-.3,.3),
    z:rnd(.15,.4)
   });
  }

  /* HOJAS */

  const leafGeo=new THREE.SphereGeometry(1,5,4);
  this.leaves=[];

  for(let i=0;i<9;i++){
   const mat=new THREE.MeshStandardMaterial({
    color:['#d58b32','#b85b26','#e9b34d','#d4a044'][i%4],
    roughness:1,
    side:THREE.DoubleSide
   });

   const leaf=new THREE.Mesh(leafGeo,mat);
   leaf.scale.set(.035,.085,.009);
   root.add(leaf);

   this.leaves.push({
    mesh:leaf,
    x:rnd(-.7,.7),
    phase:rnd(0,6.28),
    speed:rnd(.07,.15),
    y:rnd(-A/2,A/2)
   });
  }

  /* PARTÍCULAS */

  const N=35;
  const geo=new THREE.BufferGeometry();
  const positions=new Float32Array(N*3);

  this.particles=[];

  for(let i=0;i<N;i++){
   this.particles.push({
    x:rnd(-.75,.75),
    y:rnd(-A/2,A/2),
    z:rnd(.05,.65),
    phase:rnd(0,6.28),
    speed:rnd(.15,.35)
   });
  }

  geo.setAttribute('position',new THREE.BufferAttribute(positions,3));

  const particleMat=new THREE.PointsMaterial({
   color:'#ffd58c',
   size:.045,
   map:glowTexture,
   transparent:true,
   blending:THREE.AdditiveBlending,
   depthWrite:false,
   sizeAttenuation:true
  });

  this.points=new THREE.Points(geo,particleMat);
  root.add(this.points);

  /* ANILLO DE DESPERTAR */

  this.ring=new THREE.Mesh(
   new THREE.RingGeometry(.4,.42,40),
   new THREE.MeshBasicMaterial({
    color:'#ffd58c',
    transparent:true,
    opacity:0,
    side:THREE.DoubleSide,
    depthWrite:false
   })
  );

  this.ring.position.z=.03;
  root.add(this.ring);

  this.el.addEventListener('targetFound',()=>{
   if(!this.active){
    this.active=true;
    this.elapsed=0;
   }
  });

  this.el.addEventListener('targetLost',()=>{
   this.active=false;
  });
 },

 tick:function(time,dt){

  if(!this.active)return;

  dt=Math.min(dt,40)/1000;
  this.time+=dt;
  this.elapsed+=dt;

  const t=this.time;
  const A=this.data.aspect;

  this.fade=Math.min(1,this.fade+dt*.7);

  /* ANILLO */

  const pulse=(this.elapsed%2.5)/2.5;
  this.ring.scale.setScalar(.5+pulse*2);
  this.ring.material.opacity=(1-pulse)*.35*this.fade;

  /* MARIPOSAS */

  this.butterflies.forEach(b=>{

   const age=Math.max(0,this.elapsed-b.start);
   const emergence=clamp(age/2.8,0,1);
   const ease=1-Math.pow(1-emergence,3);

   const u=t*b.speed+b.phase;

   const x=b.x+
    Math.sin(u)*.34+
    Math.sin(u*1.7)*.08;

   const y=b.y+
    Math.sin(u*.75)*.3+
    Math.cos(u*1.5)*.05;

   const z=b.z+
    Math.sin(u*.8)*.22+
    age*.045;

   b.group.position.set(
    x*ease,
    y*ease,
    z*ease
   );

   b.group.scale.setScalar(b.size*ease);

   b.group.rotation.z=
    Math.sin(u)*.22;

   b.group.rotation.x=
    Math.sin(u*.7)*.15;

   /* ALETEO ARTICULADO */

   const flap=Math.sin(t*12+b.phase)*.75;

   b.leftPivot.rotation.y=flap;
   b.rightPivot.rotation.y=-flap;

  });

  /* HOJAS */

  this.leaves.forEach(l=>{
   l.mesh.position.set(
    l.x+Math.sin(t*.7+l.phase)*.08,
    l.y+Math.sin(t*l.speed+l.phase)*.3,
    .2+Math.sin(t*.8+l.phase)*.15
   );

   l.mesh.rotation.z=t*.7+l.phase;
  });

  /* PARTÍCULAS */

  const pos=this.points.geometry.attributes.position;

  this.particles.forEach((p,i)=>{
   const y=((p.y+A/2+t*p.speed)%(A+.3))-A/2;

   pos.setXYZ(
    i,
    p.x+Math.sin(t+p.phase)*.05,
    y,
    p.z
   );
  });

  pos.needsUpdate=true;
 }
});

})();
</script>

<script>
/* INTERFAZ Y CAPTURA */

const scene=document.querySelector('a-scene');
const body=document.body;
const status=document.getElementById('status');
const photo=document.getElementById('photo');
const record=document.getElementById('record');

let found=false;
let recorder=null;
let chunks=[];
let recording=false;
let compositeCanvas=null;
let compositeContext=null;
let animationFrame=null;

function getVideo(){
 return document.querySelector('video');
}

function getRendererCanvas(){
 return scene.canvas || scene.renderer?.domElement;
}

function prepareCanvas(){

 const video=getVideo();
 const renderer=getRendererCanvas();

 if(!video || !renderer ||
    !video.videoWidth || !video.videoHeight){
  throw new Error('La cámara todavía no está lista');
 }

 const width=Math.min(video.videoWidth,1280);
 const height=Math.round(width*video.videoHeight/video.videoWidth);

 compositeCanvas=document.createElement('canvas');
 compositeCanvas.width=width;
 compositeCanvas.height=height;

 compositeContext=compositeCanvas.getContext('2d',{
  alpha:false
 });

 return {video,renderer};
}

function drawComposite(){

 if(!recording)return;

 const video=getVideo();
 const renderer=getRendererCanvas();

 if(video && renderer && video.readyState>=2){

  const w=compositeCanvas.width;
  const h=compositeCanvas.height;

  compositeContext.drawImage(video,0,0,w,h);

  compositeContext.drawImage(
   renderer,
   0,0,
   w,h
  );
 }

 animationFrame=requestAnimationFrame(drawComposite);
}

/* FOTO */

photo.addEventListener('click',()=>{

 try{

  const {video,renderer}=prepareCanvas();

  compositeContext.drawImage(
   video,0,0,
   compositeCanvas.width,
   compositeCanvas.height
  );

  compositeContext.drawImage(
   renderer,0,0,
   compositeCanvas.width,
   compositeCanvas.height
  );

  compositeCanvas.toBlob(blob=>{

   if(!blob){
    status.textContent='No se pudo crear la fotografía';
    return;
   }

   const url=URL.createObjectURL(blob);
   const a=document.createElement('a');

   a.href=url;
   a.download='Montevía-Bosque-Encantado.jpg';
   a.click();

   setTimeout(()=>URL.revokeObjectURL(url),3000);
   status.textContent='Fotografía guardada';

  },'image/jpeg',.88);

 }catch(e){
  status.textContent=e.message;
 }
});

/* VIDEO */

record.addEventListener('click',()=>{

 if(recording){
  recorder.stop();
  return;
 }

 try{

  prepareCanvas();

  const stream=compositeCanvas.captureStream(24);

  let mime='video/webm;codecs=vp8';

  if(!MediaRecorder.isTypeSupported(mime)){
   mime='video/webm';
  }

  if(!MediaRecorder.isTypeSupported(mime)){
   throw new Error('Este navegador no admite grabación WebM');
  }

  chunks=[];

  recorder=new MediaRecorder(stream,{
   mimeType:mime,
   videoBitsPerSecond:2500000
  });

  recorder.ondataavailable=e=>{
   if(e.data && e.data.size>0)chunks.push(e.data);
  };

  recorder.onstop=()=>{

   recording=false;
   cancelAnimationFrame(animationFrame);

   const blob=new Blob(chunks,{type:'video/webm'});
   const url=URL.createObjectURL(blob);

   const a=document.createElement('a');
   a.href=url;
   a.download='Montevía-Bosque-Encantado.webm';
   a.click();

   setTimeout(()=>URL.revokeObjectURL(url),5000);

   record.textContent='● GRABAR VIDEO';
   record.classList.remove('recording');
   status.textContent='Video guardado';

   stream.getTracks().forEach(track=>track.stop());
  };

  recorder.onerror=()=>{
   status.textContent='Error durante la grabación';
  };

  recording=true;
  record.textContent='■ DETENER VIDEO';
  record.classList.add('recording');

  recorder.start(500);
  drawComposite();

  status.textContent='Grabando experiencia…';

 }catch(e){
  recording=false;
  status.textContent=e.message;
 }
});

/* RECONOCIMIENTO DEL CUADRO */

document.querySelectorAll('[mindar-image-target]').forEach(target=>{

 target.addEventListener('targetFound',()=>{
  found=true;
  body.classList.add('found');
  status.textContent='';
 });

 target.addEventListener('targetLost',()=>{
  found=false;
  body.classList.remove('found');
 });
});

scene.addEventListener('arReady',()=>{
 document.getElementById('hint').textContent=
 'Apunta al cuadro y descubre la magia';
});

scene.addEventListener('arError',()=>{
 document.getElementById('hint').textContent=
 'No se pudo abrir la cámara. Revisa los permisos.';
 status.textContent='Error de cámara';
});

</script>
</body>
</html>
